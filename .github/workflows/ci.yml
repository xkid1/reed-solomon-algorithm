name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml

  code-conventions:
    needs:
      - test
      - build
    if: ${{ needs.test.result == 'success' && needs.build.result == 'success' }}
    uses: ./.github/workflows/code-conventions.yml

  ci-passed:
    name: CI passed
    needs:
      - test
      - build
      - code-conventions
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CONVENTIONS_RESULT: ${{ needs.code-conventions.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$CONVENTIONS_RESULT" != "success" ]]; then
            echo "One or more CI checks did not pass."
            exit 1
          fi
          echo "All CI checks passed."
