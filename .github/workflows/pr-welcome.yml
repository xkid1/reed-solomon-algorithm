name: Welcome first-time contributors

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v3
        with:
          repo-token: ${{ github.token }}
          issue-message: 'Thanks for opening your first issue. We will take a look soon.'
          pr-message: 'Thanks for opening your first pull request. We will review it soon.'
