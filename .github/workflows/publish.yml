name: Publish package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to finalize after npm approval
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Stage npm or finalize release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: ./.github/actions/setup

      - name: Verify tag and changelog
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const releaseTag = process.env.RELEASE_TAG;
          if (releaseTag !== `v${packageJson.version}`) {
            throw new Error(`Release tag ${releaseTag} must match v${packageJson.version}`);
          }

          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          if (!changelog.includes(`## [${packageJson.version}]`)) {
            throw new Error(`CHANGELOG.md must include ## [${packageJson.version}]`);
          }
          NODE

      - name: Run package checks
        run: yarn check

      - name: Verify packed consumer
        run: bash scripts/smoke-consumer.sh

      # Tag pushes stage on npm; approval is completed manually in npm.
      - name: Setup Node for npmjs.com
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          scope: '@xkid1'

      - name: Stage on npm
        if: github.event_name == 'push'
        run: npm stage publish . --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          PUBLISHED_VERSION=$(npm view "@xkid1/reed-solomon-algorithm@$VERSION" version \
            --registry=https://registry.npmjs.org \
            '--@xkid1:registry=https://registry.npmjs.org')
          if [ "$PUBLISHED_VERSION" != "$VERSION" ]; then
            echo "Expected npm version $VERSION, found $PUBLISHED_VERSION."
            exit 1
          fi

      # Manual dispatch runs after npm approval and publishes to GitHub Packages.
      - name: Setup Node for GitHub Packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://npm.pkg.github.com'
          scope: '@xkid1'

      - name: Publish to GitHub Packages
        if: github.event_name == 'workflow_dispatch'
        run: yarn npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --generate-notes --verify-tag
          fi
